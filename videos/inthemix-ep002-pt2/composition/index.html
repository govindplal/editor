<style>
  :root {
    --yellow: #F5EC2A;
    --purple: #3A1E4D;
    --ink: #111014;
    --white: #ffffff;
    --red: #E2231A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: 'Montserrat', sans-serif; }

  /* ---------- footage ---------- */
  #cam { position: absolute; inset: 0; transform-origin: 50% 30%; will-change: transform; }
  #cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 100%); }

  /* ---------- chrome: top pill + progress ---------- */
  #top { position: absolute; top: 70px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; }
  .pill { font-weight: 800; font-size: 30px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 26px; border-radius: 40px; }
  .pill.brand { background: var(--yellow); color: var(--purple); }
  .pill.topic { background: rgba(17,16,20,.78); color: #fff; border: 3px solid var(--yellow); }
  #progress { position: absolute; top: 0; left: 0; height: 12px; width: 100%; background: var(--yellow); transform-origin: 0 50%; transform: scaleX(0); }

  /* ---------- captions ---------- */
  .cap { position: absolute; left: 30px; right: 30px; top: 1120px; text-align: center; opacity: 0; visibility: hidden;
    font-weight: 900; font-size: 84px; line-height: 1.05; text-transform: uppercase; color: #fff; }
  .cap .w { display: inline-block; margin: 0 14px; transform-origin: 50% 70%;
    text-shadow: 0 0 2px #000, 4px 4px 0 #000, -4px 4px 0 #000, 4px -4px 0 #000, -4px -4px 0 #000, 0 6px 0 #000, 0 -5px 0 #000, 6px 0 0 #000, -6px 0 0 #000, 0 14px 22px rgba(0,0,0,.55); }
  .cap .w.on { color: var(--yellow); }
  .cap .w.big { font-size: 110px; }

  /* ---------- graphics band ---------- */
  .g { position: absolute; opacity: 0; visibility: hidden; }
  .label { font-family: 'Anton', sans-serif; color: #fff; text-transform: uppercase; letter-spacing: 2px; text-align: center;
    text-shadow: 0 6px 0 rgba(0,0,0,.6); }
  .chip { display: inline-block; background: var(--purple); color: var(--yellow); font-family: 'Anton'; font-size: 46px; padding: 6px 26px 10px; border-radius: 14px; letter-spacing: 3px; border: 4px solid var(--yellow); }

  #buddy { position: absolute; left: 820px; top: 1390px; width: 210px; height: 210px; opacity: 0; visibility: hidden; transform-origin: 50% 100%; }
  #buddy .face { opacity: 0; }
  .bubble { position: absolute; font-family: 'Bangers'; font-size: 64px; color: var(--purple); background: var(--yellow); border: 5px solid var(--ink);
    padding: 4px 22px 0; border-radius: 26px; letter-spacing: 2px; }
</style>
</head>

// (English + Malayalam translated where the speakers switch language).
const GROUPS = [
  [[["It",0.32],["might",0.48],["be",0.72],["surprising",0.96]], 1.6],
  [[["for",1.6],["most",1.76],["of",2.0],["our",2.16]], 2.6],

// ---------- camera: per-shot zooms, punches, shakes ----------
const cam = '#cam';
function shot(t0, t1, s0, s1, origin) {
  tl.set(cam, { scale: s0, x: 0, y: 0, rotation: 0, transformOrigin: origin || '50% 30%' }, t0);
  tl.to(cam, { scale: s1, duration: t1 - t0, ease: 'none' }, t0);
}
function punch(t, s, dur) {
  tl.to(cam, { scale: s, duration: dur || 0.12, ease: 'power3.out' }, t);
}
function shake(t, dur, amp) {
  const n = Math.round(dur / 0.05);
  for (let i = 0; i < n; i++) {
    const a = amp * (1 - i / n);
    tl.to(cam, { x: (i % 2 ? -1 : 1) * a, y: (i % 3 - 1) * a * 0.6, rotation: (i % 2 ? 1 : -1) * a * 0.04, duration: 0.05, ease: 'none' }, t + i * 0.05);
  }
  tl.to(cam, { x: 0, y: 0, rotation: 0, duration: 0.05 }, t + n * 0.05);
}
function flash(t) {
  tl.fromTo('#flash', { opacity: 0.75 }, { opacity: 0, duration: 0.2, ease: 'power2.out', immediateRender: false }, t);
}
